<title>무신사 수금 현황 (보호됨)</title>
<style>
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; font-family:'Pretendard','Helvetica Neue',-apple-system,sans-serif; }
  #gate { min-height:100%; display:flex; align-items:center; justify-content:center; background:#f4f4f5; padding:24px; }
  .box { width:100%; max-width:340px; background:#fff; border:1px solid #e0e0e0; border-radius:10px; padding:28px 22px; box-shadow:0 6px 24px rgba(0,0,0,.08); }
  .lock { font-size:30px; text-align:center; margin-bottom:10px; }
  h1 { font-size:16px; margin:0 0 4px; text-align:center; color:#1a1a1a; }
  p.sub { font-size:12px; color:#777; text-align:center; margin:0 0 18px; }
  input { width:100%; font-size:16px; padding:12px 14px; border:1.5px solid #d0d0d0; border-radius:8px; outline:none; }
  input:focus { border-color:#1a1a1a; }
  button { width:100%; margin-top:12px; font-size:15px; font-weight:600; padding:12px; border:0; border-radius:8px; background:#1a1a1a; color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; }
  .err { color:#c0392b; font-size:12px; margin-top:10px; min-height:16px; text-align:center; }
  .caps { display:none; align-items:center; justify-content:center; gap:5px; margin-top:10px; font-size:12px; color:#92400e; background:#fef6e0; border:1px solid #f3d98a; border-radius:7px; padding:7px 10px; }
  .caps.on { display:flex; }
  .caps svg { flex:0 0 auto; }
  iframe { border:0; width:100%; height:100vh; display:block; }
  /* iframe 높이를 실제 보이는 영역(dvh)으로 제한 → 내부 '맨위로' 버튼이 모바일 하단 툴바 뒤로 잘리지 않음 */
  @supports (height:100dvh){ iframe { height:100dvh; } }
  #frameWrap { display:none; }
  .pwwrap { position:relative; }
  .pwwrap input { padding-right:46px; }
  #eye { position:absolute; top:0; right:0; height:100%; width:44px; margin:0; padding:0; background:transparent; color:#888; font-size:18px; font-weight:400; box-shadow:none; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #eye:hover { color:#1a1a1a; }
  .auto { display:flex; align-items:center; gap:7px; margin-top:12px; font-size:13px; color:#444; cursor:pointer; user-select:none; }
  .auto input { width:18px; height:18px; margin:0; padding:0; flex:0 0 auto; accent-color:#1a1a1a; }
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <div class="lock">🔒</div>
    <h1>무신사 수금 현황</h1>
    <p class="sub">열람 비밀번호를 입력하세요</p>
    <form id="f">
      <div class="pwwrap">
        <input id="pw" type="password" inputmode="text" autocomplete="off" placeholder="비밀번호" autofocus>
        <button id="eye" type="button" aria-label="비밀번호 표시" title="비밀번호 표시"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="caps" id="caps"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8l-6 6h4v3h4v-3h4z"/><line x1="6" y1="20" x2="18" y2="20"/></svg><span>Caps Lock이 켜져 있습니다</span></div>
      <label class="auto"><input id="auto" type="checkbox">자동 로그인 (이 기기에서 비밀번호 기억)</label>
      <button id="go" type="submit">열기</button>
      <div class="err" id="err"></div>
    </form>
  </div>
</div>

   -> 첫 조각만 no-store로 받아 build-id를 비교하고, 다르면 캐시를 우회한 주소로 한 번 재이동.
   VER_CHECK: 버전 확인이 끝나면(같은 버전·실패·건너뜀) 풀린다. 자동 로그인은 이걸 기다린 뒤 연다. */
var verDone; const VER_CHECK = new Promise(function(r){ verDone = r; });
(function(){
  try {
    if (!window.fetch || location.protocol === "file:") return verDone();
    var tries = +(sessionStorage.getItem("mb_reload_tries") || 0);
    if (tries >= 2) return verDone();
    fetch(location.pathname + "?_cb=" + Date.now(), { cache: "no-store" }).then(function(res){
      if (!res.ok) return null;
      if (res.body && res.body.getReader) {
        var reader = res.body.getReader();
        return reader.read().then(function(r){
          try { reader.cancel(); } catch(_) {}
          return new TextDecoder().decode(r.value || new Uint8Array());
        });
      }
      return res.text().then(function(t){ return t.slice(0, 8192); });
    }).then(function(text){
      if (!text) return verDone();
      var m = text.match(/name="build-id" content="([^"]+)"/);
      if (!m) return verDone();
      if (m[1] === BUILD_ID) { sessionStorage.removeItem("mb_reload_tries"); return verDone(); }
      var gate = document.getElementById("gate");
      if (gate && gate.style.display === "none") return verDone();   // 이미 열어본 상태면 방해하지 않음
      sessionStorage.setItem("mb_reload_tries", tries + 1);
      location.replace(location.pathname + "?v=" + m[1]);
    }).catch(function(){ verDone(); });
  } catch(_) { verDone(); }
})();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iter, hash:'SHA-256' },
    km, { name:'AES-GCM', length:256 }, false, ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(ENC.iv) }, key, b64(ENC.data));
  return new TextDecoder().decode(plain);
}
(function(){
  var eye=document.getElementById('eye'), pw=document.getElementById('pw');
  if(eye&&pw){ eye.addEventListener('click', function(){
    var show = pw.type==='password';
    pw.type = show ? 'text' : 'password';
    eye.innerHTML = show ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>' : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    var label = show ? '비밀번호 숨기기' : '비밀번호 표시';
    eye.setAttribute('aria-label', label); eye.title = label;
    pw.focus();
  }); }
})();
// Caps Lock 감지 — 비밀번호 입력 중 캡스락이 켜져 있으면 경고 표시
(function(){
  var pw=document.getElementById('pw'), caps=document.getElementById('caps');
  if(!pw||!caps) return;
  function check(e){
    if(typeof e.getModifierState!=='function') return;
    caps.classList.toggle('on', e.getModifierState('CapsLock'));
  }
  pw.addEventListener('keydown', check);
  pw.addEventListener('keyup', check);
  pw.addEventListener('blur', function(){ caps.classList.remove('on'); });
})();
// iframe 높이를 실제 보이는 뷰포트에 맞춰 내부 '맨위로' 버튼이 하단 툴바에 가리지 않게 함
function sizeFrame(){
  var f=document.getElementById('frame');
  if(!f || document.getElementById('frameWrap').style.display==='none') return;
  var h=(window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
  f.style.height=h+'px';
}
window.addEventListener('resize', sizeFrame);
if(window.visualViewport){ window.visualViewport.addEventListener('resize', sizeFrame); window.visualViewport.addEventListener('scroll', sizeFrame); }
// 자동 로그인: 체크하고 열면 이 기기(브라우저/앱) 저장소에 비밀번호를 기억, 다음부터 바로 열림
const AUTO_KEY = 'mb_auto_pw';
function autoGet(){ try { return localStorage.getItem(AUTO_KEY); } catch(_) { return null; } }
function autoSet(pw){ try { if (pw) localStorage.setItem(AUTO_KEY, pw); else localStorage.removeItem(AUTO_KEY); } catch(_) {} }
async function openWith(pw, remember){
  const err = document.getElementById('err'); const go = document.getElementById('go');
  err.textContent=''; go.disabled=true; go.textContent='여는 중...';
  try {
    const html = await unlock(pw);
    autoSet(remember ? pw : null);
    document.getElementById('gate').style.display='none';
    const wrap = document.getElementById('frameWrap'); wrap.style.display='block';
    document.getElementById('frame').srcdoc = html;
    sizeFrame();
    return true;
  } catch(_) {
    go.disabled=false; go.textContent='열기';
    return false;
  }
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const ok = await openWith(document.getElementById('pw').value, document.getElementById('auto').checked);
  if (!ok) document.getElementById('err').textContent='비밀번호가 올바르지 않습니다.';
});
(async function(){
  const saved = autoGet(); if (!saved) return;
  const pw = document.getElementById('pw');
  document.getElementById('auto').checked = true;
  pw.blur(); document.getElementById('go').disabled = true; document.getElementById('go').textContent = '자동 로그인 중...';
  // 새 버전 확인을 먼저 끝내고 연다(최대 2.5초 대기) — 열린 뒤에는 새 버전 재이동을 하지 않기 때문
  await Promise.race([VER_CHECK, new Promise(function(r){ setTimeout(r, 2500); })]);
  const ok = await openWith(saved, true);
  if (!ok) {   // 비밀번호가 바뀐 경우: 저장값 지우고 직접 입력하게 함
    autoSet(null); document.getElementById('auto').checked = false;
    document.getElementById('err').textContent = '비밀번호가 바뀌어 자동 로그인이 해제됐습니다. 다시 입력해 주세요.';
    pw.focus();
  }
})();
